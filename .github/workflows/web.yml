name: web

on:
  push:
    branches: [main]
    paths: ["packages/web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Gated on a repository variable (not a secret) so merging before the
    # Cloudflare secrets exist doesn't produce failed runs. Set the
    # CLOUDFLARE_DEPLOY variable to "true" when adding the secrets.
    if: ${{ vars.CLOUDFLARE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @kowork/web build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "packages/web"
          packageManager: pnpm

name: release

run-name: "release v${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (semver, e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  HUSKY: "0"
  KOWORK_CHANNEL: prod

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Guard stable releases to main
        run: |
          if [[ "${{ inputs.version }}" != *-* && "${{ github.ref_name }}" != "main" ]]; then
            echo "::error::stable releases must be dispatched from main (on ${{ github.ref_name }})"
            exit 1
          fi

      - id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::invalid semver: $VERSION"
            exit 1
          fi
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG already exists"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::a release for $TAG already exists"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # main requires PRs (repository ruleset), so the release is tag-only;
      # build jobs apply the version to their own checkout.
      - name: Tag the release
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "${{ steps.version.outputs.tag }}"
          git push origin "refs/tags/${{ steps.version.outputs.tag }}"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=(--draft --generate-notes)
          if [[ "${{ steps.version.outputs.version }}" == *-* ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            "${ARGS[@]}"

  build:
    needs: prepare
    permissions:
      contents: write # electron-builder --publish uploads release assets
      id-token: write # azure/login OIDC federation (Windows leg)
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-26
            arch: arm64
            os: mac
            platform_flag: --mac --arm64
          - host: windows-2025
            arch: x64
            os: win
            platform_flag: --win --x64
    runs-on: ${{ matrix.host }}
    # Bash (Git Bash on Windows) keeps the shell snippets below portable.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          submodules: recursive

      # electron-builder compiles the app icon via actool, which requires Xcode 26+.
      - name: Select Xcode 26
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -t. -k2,2nr | head -1 || true)"
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "$XCODE/Contents/Developer"
          fi
          xcodebuild -version

      # Mirrors upstream; electron-builder imports CSC_LINK on its own too.
      - uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        if: runner.os == 'macOS'
        with:
          keychain: build
          p12-file-base64: ${{ secrets.CSC_LINK }}
          p12-password: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Setup Apple API key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: echo "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/apple-api-key.p8"

      # Establishes the Azure CLI session that sign-windows.ps1 authenticates
      # against. Skipped unless the OIDC federation secrets are configured.
      - name: Azure login
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != ''
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: opencode/package.json

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # electron-builder reads the version from package.json
      - name: Set version
        run: npm pkg set version="${{ needs.prepare.outputs.version }}" --prefix packages/electron

      - name: Install opencode sidecar dependencies
        working-directory: opencode
        run: bun install --frozen-lockfile

      - run: pnpm install --frozen-lockfile
        env:
          # smoke:runtime needs the real Electron binary for the node shim
          ELECTRON_SKIP_BINARY_DOWNLOAD: ""

      - name: Build
        run: pnpm --filter @kowork/electron build

      - name: Runtime pack
        run: pnpm --filter @kowork/electron run ensure:runtime

      - name: Smoke-test runtime pack
        run: pnpm --filter @kowork/electron run smoke:runtime

      - name: Package and publish
        working-directory: packages/electron
        timeout-minutes: 60
        run: pnpm exec electron-builder ${{ matrix.platform_flag }} --publish always --config electron-builder.config.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # Ported from opencode's publish.yml. Runs only when signing is
      # configured; an unsigned or invalid exe here means signing regressed.
      - name: Verify signed Windows Electron artifacts
        if: runner.os == 'Windows' && env.AZURE_TRUSTED_SIGNING_ENDPOINT != '' && env.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME != '' && env.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE != ''
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem "${{ github.workspace }}\packages\electron\dist\*.exe" | Select-Object -ExpandProperty FullName
          $files += Get-ChildItem "${{ github.workspace }}\packages\electron\dist\*unpacked\*.exe" | Select-Object -ExpandProperty FullName
          $files += Get-ChildItem "${{ github.workspace }}\packages\electron\dist\*unpacked\resources\*.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName

          foreach ($file in $files | Select-Object -Unique) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne "Valid") {
              throw "Invalid signature for ${file}: $($sig.Status)"
            }
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kowork-electron-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            packages/electron/dist/*.dmg
            packages/electron/dist/*.zip
            packages/electron/dist/*.exe
            packages/electron/dist/latest*.yml

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      # gh release edit runs git to resolve the repo and fails without a checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.prepare.outputs.tag }}" --draft=false
